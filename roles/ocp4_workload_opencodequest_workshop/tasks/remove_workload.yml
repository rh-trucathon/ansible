---
# Implement your Workload removal tasks here
# -----------------------------------------

- name: Delete EDB ArgoCD Application
  kubernetes.core.k8s:
    state: absent
    api_version: argoproj.io/v1alpha1
    kind: Application
    name: edb
    namespace: "{{ argocd.namespace }}"
  when: enable_edb | default(true)

- name: Delete EDB Workshop Prod ArgoCD Application
  kubernetes.core.k8s:
    state: absent
    api_version: argoproj.io/v1alpha1
    kind: Application
    name: edb-workshop-prod
    namespace: "{{ argocd.namespace }}"
  when: enable_edb_workshop_prod | default(true)

- name: Delete ACS Config Job ArgoCD Application
  kubernetes.core.k8s:
    state: absent
    api_version: argoproj.io/v1alpha1
    kind: Application
    name: acs-config
    namespace: "{{ argocd.namespace }}"
  when: enable_acs | default(true)

- name: Delete DevSpaces Config Job ArgoCD Application
  kubernetes.core.k8s:
    state: absent
    api_version: argoproj.io/v1alpha1
    kind: Application
    name: devspaces-config
    namespace: "{{ argocd.namespace }}"
  when: enable_devspaces | default(true)

- name: Delete GitLab Config Job ArgoCD Application
  kubernetes.core.k8s:
    state: absent
    api_version: argoproj.io/v1alpha1
    kind: Application
    name: "gitlab-config-{{ cluster }}"
    namespace: "{{ argocd.namespace }}"
  when: enable_gitlab | default(true)

- name: Delete Keycloak Config Job ArgoCD Application
  kubernetes.core.k8s:
    state: absent
    api_version: argoproj.io/v1alpha1
    kind: Application
    name: "keycloak-config-{{ cluster }}"
    namespace: "{{ argocd.namespace }}"
  when: enable_keycloak | default(true)

- name: Delete RHDH Config Job ArgoCD Application
  kubernetes.core.k8s:
    state: absent
    api_version: argoproj.io/v1alpha1
    kind: Application
    name: "rhdh-config-{{ cluster }}"
    namespace: "{{ argocd.namespace }}"
  when: enable_rhdh | default(true)

# Leave these as the last tasks in the playbook
# ---------------------------------------------

# For deployment onto a dedicated cluster (as part of the
# cluster deployment) set workload_shared_deployment to False
# This is the default so it does not have to be set explicitely
- name: Workload removal tasks complete
  ansible.builtin.debug:
    msg: "Workload removal tasks completed successfully."
  when:
    - not silent | bool
    - not workload_shared_deployment | default(false) | bool

# For RHPDS deployment (onto a shared cluster) set
# workload_shared_deployment to True
# (in the deploy script or AgnosticV configuration)
- name: Workload removal tasks complete
  ansible.builtin.debug:
    msg: "Workload removal checks completed successfully"
  when:
    - not silent | bool
    - workload_shared_deployment | default(false) | bool

