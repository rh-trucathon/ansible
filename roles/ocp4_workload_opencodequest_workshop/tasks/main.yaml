---
# Do not modify this file

- name: Set default variables if not provided
  set_fact:
    ACTION: "{{ ACTION | default('create') }}"
    become_override: "{{ become_override | default(false) }}"
    silent: "{{ silent | default(false) }}"
    workload_shared_deployment: "{{ workload_shared_deployment | default(false) }}"

- name: Running Pre Workload Tasks
  ansible.builtin.include_tasks:
    file: ./pre_workload.yaml
    apply:
      become: "{{ become_override | bool }}"
  when: ACTION == "create" or ACTION == "provision"

- name: Running Workload Tasks
  ansible.builtin.include_tasks:
    file: ./workload.yaml
    apply:
      become: "{{ become_override | bool }}"
  when: ACTION == "create" or ACTION == "provision"

- name: Running Post Workload Tasks
  ansible.builtin.include_tasks:
    file: ./post_workload.yaml
    apply:
      become: "{{ become_override | bool }}"
  when: ACTION == "create" or ACTION == "provision"

- name: Running Workload removal Tasks
  ansible.builtin.include_tasks:
    file: ./remove_workload.yaml
    apply:
      become: "{{ become_override | bool }}"
  when: ACTION == "destroy" or ACTION == "remove"
